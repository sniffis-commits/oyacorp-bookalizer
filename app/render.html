<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>בקרת גאומטריה · משנה תורה</title>
<style>
  body { font-family: "Noto Sans Hebrew", Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  #controls {
    background: #f3f4f6; border-bottom: 1px solid #d1d5db; padding: 8px 14px;
    display: flex; gap: 22px; align-items: center; font-size: 13px; flex-wrap: wrap;
  }
  #controls label { display: flex; gap: 8px; align-items: center; }
  #controls output { min-width: 52px; display: inline-block; color: #374151; }
  #status { color: #6b7280; font-size: 12px; }
  #vpwrap { flex: 1; overflow: auto; background: #9ca3af; display: flex; }
  #viewport { margin: auto; }
</style>
</head>
<body>
<div id="controls">
  <label>רוחב עמודת מקור
    <input id="srcW" type="range" min="70" max="130" value="114" step="1">
    <output id="srcWOut">114 מ״מ</output>
  </label>
  <label>רוחב עמודת פרשנים
    <input id="commW" type="range" min="20" max="50" value="31" step="1">
    <output id="commWOut">31 מ״מ</output>
  </label>
  <label>גודל גופן מקור
    <input id="fs" type="range" min="8" max="14" value="10.5" step="0.5">
    <output id="fsOut">10.5pt</output>
  </label>
  <span id="status">מרנדר…</span>
</div>
<div id="vpwrap"><div id="viewport"></div></div>
<script src="core/core-bundle.js"></script>
<script>
  // Basic visual geometry control: sliders -> generated userStyle text -> live re-layout
  // through the Vivliostyle Core API (same machinery the anchored-floating layer uses).
  const srcW = document.getElementById('srcW'), commW = document.getElementById('commW'), fs = document.getElementById('fs');
  const statusEl = document.getElementById('status');
  let renderSeq = 0;

  function buildCss(p) {
    const side = (210 - p.srcW) / 2;
    const commFs = Math.max(7, p.fs - 2);
    return '@page { size: A4; margin: 0; }\n' +
      '@-epubx-page-template {\n' +
      '  @-epubx-flow raavad { -epubx-flow-consume: all; }\n' +
      '  @-epubx-flow km     { -epubx-flow-consume: all; }\n' +
      '  .comm.raavad { -epubx-flow-into: raavad; -epubx-flow-linger: 99; }\n' +
      '  .comm.km     { -epubx-flow-into: km; -epubx-flow-linger: 99; }\n' +
      '  .head-area { content: "משנה תורה · הלכות טומאת מת · פרק י״ח"; top: 8mm; left: 15mm; right: 15mm; height: 8mm; font-size: 8.5pt; color: #777; text-align: center; border-bottom: 0.5pt solid #ccc; }\n' +
      '  .body-area { -epubx-flow-from: body; top: 20mm; bottom: 25mm; left: ' + side + 'mm; right: ' + side + 'mm; font-size: ' + p.fs + 'pt; }\n' +
      '  .km-area { -epubx-flow-from: km; top: 20mm; bottom: 25mm; right: 13mm; width: ' + p.commW + 'mm; font-size: ' + commFs + 'pt; line-height: 1.35; border-right: 0.5pt solid #ddd; padding-right: 2mm; }\n' +
      '  .raavad-area { -epubx-flow-from: raavad; top: 20mm; bottom: 25mm; left: 13mm; width: ' + p.commW + 'mm; font-size: ' + commFs + 'pt; line-height: 1.35; border-left: 0.5pt solid #ddd; padding-left: 2mm; }\n' +
      '  .page-num { content: counter(page); bottom: 6mm; left: 0; right: 0; height: 8mm; font-size: 9pt; text-align: center; color: #888; }\n' +
      '  @-epubx-page-master {\n' +
      '    @-epubx-partition class(head-area) {}\n' +
      '    @-epubx-partition class(body-area) {}\n' +
      '    @-epubx-partition class(km-area) {}\n' +
      '    @-epubx-partition class(raavad-area) {}\n' +
      '    @-epubx-partition class(page-num) {}\n' +
      '  }\n' +
      '}\n';
  }

  const viewer = new VivliostyleCore({ viewportElement: document.getElementById('viewport') });
  window.__viewer = viewer;
  viewer.addListener('readystatechange', () => {
    if (viewer.readyState === 'complete') { statusEl.textContent = 'מוכן · ' + new Date().toLocaleTimeString('he-IL'); window.__ready = true; }
  });
  window.__ready = false;
  window.__loadCss = (cssText) => {
    window.__ready = false;
    return viewer.loadDocument([{ url: 'content.html' }], { userStyleSheet: [cssText] },
      { fitToScreen: true, pageViewMode: 'singlePage' });
  };

  function params() { return { srcW: +srcW.value, commW: +commW.value, fs: +fs.value }; }
  function renderNow() {
    const seq = ++renderSeq;
    statusEl.textContent = 'מרנדר…';
    viewer.loadDocument([{ url: 'content.html' }], { userStyleSheet: [buildCss(params())] },
      { fitToScreen: true, pageViewMode: 'singlePage' });
  }
  let t = null;
  function onSlide() {
    document.getElementById('srcWOut').textContent = srcW.value + ' מ״מ';
    document.getElementById('commWOut').textContent = commW.value + ' מ״מ';
    document.getElementById('fsOut').textContent = fs.value + 'pt';
    clearTimeout(t); t = setTimeout(renderNow, 350);
  }
  [srcW, commW, fs].forEach(el => el.addEventListener('input', onSlide));
  renderNow();
</script>
</body>
</html>
